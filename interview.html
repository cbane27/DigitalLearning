<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devlin Simulation Demo</title>

<script src="https://devlin.ai/bridge.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f4f6;
}

header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
}

main{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.sim-wrapper{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

.results{
    display:none;
    margin-top:20px;
    background:white;
    padding:24px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.score{
    font-size:40px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:10px;
}

.pass{
    color:#16a34a;
    font-size:22px;
    font-weight:bold;
}

.fail{
    color:#dc2626;
    font-size:22px;
    font-weight:bold;
}

.feedback{
    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:8px;
}

.actions{
    margin-top:25px;
    display:flex;
    gap:12px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
}
</style>
</head>

<body>

<header>
    <h1>Devlin AI Simulation</h1>
</header>

<main>

<div class="sim-wrapper">
    <iframe
        id="devlinSim"
        src="https://devlin.ai/embed/a8eaefa01672826cc900187e6d7dfcc6?mode=embedded">
    </iframe>
</div>

<div id="resultPanel" class="results">

    <h2>Simulation Complete</h2>

    <div id="scoreDisplay" class="score">Completed</div>

    <div id="passFailDisplay"></div>

    <p id="timeSpent"></p>

    <div class="feedback">
        <h3>Feedback</h3>
        <div id="feedbackDisplay"></div>
    </div>

    <div class="actions">
        <button class="primary" onclick="exitSimulation()">
            Exit
        </button>

        <button class="secondary" onclick="location.reload()">
            Take Again
        </button>
    </div>

</div>

</main>

<script>

const simVariables = {};

window.addEventListener('message', (event) => {

    console.log('Incoming Message:', event.data);

    if (event.data?.type === 'SIM_SET_VAR') {

        const { name, value } = event.data;

        simVariables[name] = value;

        console.log(`Variable Updated: ${name}`, value);
    }

    if (event.data?.type === 'SIM_RESULT') {

        const result = event.data.data;

        console.log('Simulation Result:', result);

        document.getElementById('resultPanel').style.display = 'block';

        if(result.score !== null){
            document.getElementById('scoreDisplay').textContent =
                `${result.score}% Score`;
        } else {
            document.getElementById('scoreDisplay').textContent =
                'Completed';
        }

        if(result.passed === true){
            document.getElementById('passFailDisplay').innerHTML =
                '<span class="pass">PASSED</span>';
        }
        else if(result.passed === false){
            document.getElementById('passFailDisplay').innerHTML =
                '<span class="fail">NOT PASSED</span>';
        }

        document.getElementById('feedbackDisplay').textContent =
            result.feedback || 'No feedback provided.';

        document.getElementById('timeSpent').textContent =
            `Time Spent: ${Math.round(result.timeSpentSeconds)} seconds`;
    }
});

function exitSimulation(){

    if(window.history.length > 1){
        window.history.back();
    }
    else{
        window.close();
    }
}
</script>

</body>
</html>
